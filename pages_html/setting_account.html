<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление аккаунтом</title>
    <link rel="stylesheet" href="../css_styles/settings_pitomnik.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="left-sidebar">
            <div class="logo-block">
                <img src="../images/logo.png" alt="Логотип" class="logo-img">
                <div class="logo-text">
                    <span class="logo-highlight">Добрые</span>
                    <span class="logo-highlight">лапки</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn black-btn"><i class='bx bx-home-heart'></i> Животные в приюте</button>
                <a href="../pages/settings_account.html" class="nav-btn black-btn active"><i class='bx bx-user-circle'></i> Управление аккаунтом</a>
                <button class="nav-btn black-btn"><i class='bx bx-task'></i> Заявки на усыновление</button>
            </nav>
        </aside>

        <div class="main-area">
            <header class="top-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">Управление аккаунтом</h1>
                </div>
                <div class="top-buttons">
                    <button class="blue-btn" onclick="location.href='mainstr.html'"><i class='bx bx-arrow-back'></i> Назад</button>
                </div>
            </header>

            <div class="content-wrapper">
                <div class="avatar-section">
                    <div class="avatar-preview" id="avatarPreview">
                        <img id="avatarImage" src="../images/avatar_default.png" alt="Аватар">
                    </div>
                    <button class="avatar-btn blue-btn" onclick="document.getElementById('avatarInput').click();">
                        Изменить аватар
                    </button>
                    <input type="file" name="avatar" accept="image/*" id="avatarInput" style="display: none;">
                </div>

                <div class="info-section">
                    <div class="shelter-info">
                        <label>Название приюта:</label>
                        <input type="text" class="info-field" value="Название приюта">

                        <label>Адрес:</label>
                        <input type="text" class="info-field" value="Адрес">

                        <label>Дата создания:</label>
                        <input type="text" class="info-field" value="Дата создания">

                        <button class="save-btn">Сохранить изменения</button>
                    </div>

                    <div class="contacts-section">
                        <label>Контакты:</label>
                        <input type="text" placeholder="Контактный номер 1">
                        <input type="text" placeholder="Контактный номер 2">
                        <div class="socials">
                            <img src="../images/tg.png" class="social-icon" onclick="openPopup('telegram')">
                            <img src="../images/vk.png" class="social-icon" onclick="openPopup('vk')">
                        </div>
                        <button class="save-btn">Сохранить</button>
                    </div>

                    <div class="about-section">
                        <h2>Информация о приюте:</h2>
                        <textarea rows="6" placeholder="Описание...">Описание приюта здесь...</textarea>
                        <button class="save-btn">Сохранить изменения</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Всплывающее окно -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <h3 id="popup-title"></h3>
            <input type="text" id="socialInput" placeholder="Введите ссылку...">
            <div class="popup-buttons">
                <button onclick="saveSocialLink()">Окей</button>
                <button onclick="closePopup()">Отмена</button>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('avatarInput');
        const image = document.getElementById('avatarImage');

        input.addEventListener('change', () => {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    image.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        let currentPlatform = '';

        function openPopup(platform) {
            currentPlatform = platform;
            document.getElementById('popup-title').innerText = `Введите ссылку на ${platform === 'telegram' ? 'Telegram' : 'VK'}`;
            document.getElementById('socialInput').value = '';
            document.getElementById('popup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        function saveSocialLink() {
            const link = document.getElementById('socialInput').value;
            console.log(`Сохранена ссылка на ${currentPlatform}: ${link}`);
            closePopup();
        }
    </script>
</body>
</html>
