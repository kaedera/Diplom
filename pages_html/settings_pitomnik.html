<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Животные в приюте</title>
    <link rel="stylesheet" href="../css_styles/settings_pitomnik.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" type="image/png" href="../images/logo.png">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="left-sidebar">
            <div class="logo-block">
                <img src="../images/logo.png" alt="Логотип" class="logo-img">
                <div class="logo-text">
                    <span class="logo-highlight">Добрые</span>
                    <span class="logo-highlight">лапки</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="settings_pitomnik.html" class="nav-btn black-btn active"><i class='bx bx-home-heart'></i> Животные в приюте</a>
                <a href="settings_account.html" class="nav-btn black-btn"><i class='bx bx-user-circle'></i> Управление аккаунтом</a>
                <button class="nav-btn black-btn"><i class='bx bx-task'></i> Заявки на усыновление</button>
            </nav>
        </aside>

        <div class="main-area">
            <header class="top-header">
                <div class="page-title-wrapper">
                    <h1 class="page-title">Животные в приюте</h1>
                </div>
                <div class="top-buttons">
                    <button class="blue-btn" onclick="location.href='mainstr.html'"><i class='bx bx-arrow-back'></i> Назад</button>
                    <button class="blue-btn"><i class='bx bx-log-out'></i> Выход</button>
                    <div class="avatar-wrapper">
                        <img src="../images/avatar_default.png" alt="Аватар" class="avatar-img">
                    </div>
                </div>
            </header>

            <div class="controls-bar">
                <div class="filters">
                    <button class="sort-btn"><i class='bx bx-sort-up'></i></button>
                    <button class="sort-btn"><i class='bx bx-sort-down'></i></button>

                    <select class="filter-select">
                        <option value="">Вид животного</option>
                    </select>
                    <select class="filter-select">
                        <option value="">Порода</option>
                    </select>
                </div>
                <button class="add-btn">Добавить животное</button>
            </div>

            <div class="animals-grid" id="animalsGrid"></div>
            <div class="pagination">
                <button id="prevPage">&larr; Назад</button>
                <span id="pageIndicator">Стр. 1</span>
                <button id="nextPage">Вперёд &rarr;</button>
            </div>
        </div>
    </div>

    <script>
        const animalsData = Array.from({length: 30}, (_, i) => ({
            name: `Эмиль ${i + 1}`,
            description: 'Очень милый и дружелюбный. Ищет добрые руки.',
            image: '../images/dog.png'
        }));

        const animalsPerPage = 8;
        let currentPage = 1;

        function renderAnimals() {
            const grid = document.getElementById('animalsGrid');
            grid.innerHTML = '';

            const start = (currentPage - 1) * animalsPerPage;
            const currentAnimals = animalsData.slice(start, start + animalsPerPage);

            currentAnimals.forEach(animal => {
                const card = document.createElement('div');
                card.className = 'card-container';
                card.innerHTML = `
                    <div class="product-card">
                        <div class="image-block">
                            <img src="${animal.image}" alt="${animal.name}">
                        </div>
                        <div class="product-info">
                            <h2>${animal.name}</h2>
                            <p>${animal.description}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('pageIndicator').textContent = `Стр. ${currentPage}`
        }

        document.getElementById('prevPage').addEventListener('click', () => {
            if (currentPage > 1) {
                currentPage--;
                renderAnimals();
            }
        });

        document.getElementById('nextPage').addEventListener('click', () => {
            if (currentPage * animalsPerPage < animalsData.length) {
                currentPage++;
                renderAnimals();
            }
        });

        renderAnimals();
    </script>
</body>
</html>
