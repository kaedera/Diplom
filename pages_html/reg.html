<!DOCTYPE html>
<html lang="ru">

    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="../css_styles/regstyle.css">
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link rel="icon" type="image/png" href="../images/logo.png">
        <title>Регистрация</title>
    </head>
    <body>
        <header class="header">
            <div class="header-content">
                <div class="logo-name">
                    <img src="../images/logo.png" alt="Логотип" class="logo-img">
                    <div class="logo-name-text">
                        <span>Добрые</span>
                        <span>лапки</span>
                    </div>
                    <a href="index.html" class="back-button">←</a>
                </div>
            </div>
        </header>
    
        <div class="wrapper">
            <h2 class="registration-title">Регистрация</h2>

            <div class="avatar-section">
                <div class="avatar-preview" id="avatarPreview">
                    <img id="avatarImage" src="../images/avatar_default.png" alt="Аватар">
                </div>
                <label for="avatarInput" class="avatar-label">Добавить аватар</label>
                <input type="file" name="avatar" accept="image/*" id="avatarInput">
            </div>

            <div class="role-selector">
                <label class="role-label">Роль:</label>
                <div class="role-buttons">
                    <button type="button" class="role-button active" id="userBtn">Пользователь</button>
                    <button type="button" class="role-button" id="shelterBtn">Приют</button>
                </div>
            </div>

            <!-- Форма Пользователя -->
            <form action="#" method="post" enctype="multipart/form-data" id="userForm" class="form-toggle active">
                <div class="input-box">
                    <label>Фамилия:</label>
                    <input type="text" name="surname" placeholder="Введите фамилию" required>
                </div>
                <div class="input-box">
                    <label>Имя:</label>
                    <input type="text" name="name" placeholder="Введите имя" required>
                </div>
                <div class="input-box">
                    <label>Отчество*:</label>
                    <input type="text" name="patronymic" placeholder="Введите отчество">
                </div>
                <div class="input-box">
                    <label>Дата рождения:</label>
                    <input type="date" name="foundation_date" required>
                </div>
                <div class="input-box">
                    <label>Email:</label>
                    <input type="email" name="email" placeholder="Введите email" required>
                </div>
                <div class="input-box">
                    <label>Логин:</label>
                    <input type="text" name="login" placeholder="Введите логин" required>
                </div>
                <div class="input-box password-box">
                    <label>Пароль:</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" placeholder="Введите пароль" required id="passwordInput">
                        <span class="toggle-password" id="togglePassword">
                            <i class='bx bx-hide'></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="register-btn">Зарегистрироваться</button>
            </form>

            <!-- Форма Приюта -->
            <form action="#" method="post" enctype="multipart/form-data" id="shelterForm" class="form-toggle">
                <div class="input-box">
                    <label>Название приюта:</label>
                    <input type="text" name="shelter_name" placeholder="Введите название приюта" required>
                </div>
                <div class="input-box">
                    <label>Адрес:</label>
                    <input type="text" name="shelter_address" placeholder="Введите адрес" required>
                </div>
                <div class="input-box">
                    <label>Дата создания:</label>
                    <input type="date" name="foundation_date" required>
                </div>
                <div class="input-box">
                    <label>Контактный номер:</label>
                    <input type="tel" name="contact_phone" placeholder="Введите номер телефона" required>
                </div>
                <div class="input-box">
                    <label>Логин:</label>
                    <input type="text" name="login" placeholder="Введите логин" required>
                </div>
                <div class="input-box password-box">
                    <label>Пароль:</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" placeholder="Введите пароль" required id="passwordInput">
                        <span class="toggle-password" id="togglePassword">
                            <i class='bx bx-hide'></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="register-btn">Зарегистрироваться</button>
            </form>
        </div>

        <script>
            const userBtn = document.getElementById('userBtn');
            const shelterBtn = document.getElementById('shelterBtn');
            const userForm = document.getElementById('userForm');
            const shelterForm = document.getElementById('shelterForm');

            userBtn.addEventListener('click', () => {
                userBtn.classList.add('active');
                shelterBtn.classList.remove('active');
                userForm.classList.add('active');
                shelterForm.classList.remove('active');
            });

            shelterBtn.addEventListener('click', () => {
                shelterBtn.classList.add('active');
                userBtn.classList.remove('active');
                shelterForm.classList.add('active');
                userForm.classList.remove('active');
            });
        </script>
    
        <script>
            const input = document.getElementById('avatarInput');
            const image = document.getElementById('avatarImage');
            const preview = document.getElementById('avatarPreview');
    
            input.addEventListener('change', () => {
                const file = input.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        image.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });
        </script>

        <script>
            const passwordInput = document.getElementById('passwordInput');
            const togglePassword = document.getElementById('togglePassword');
            const icon = togglePassword.querySelector('i');

            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                icon.classList.toggle('bx-hide');
                icon.classList.toggle('bx-show');
            });
        </script>
    </body>
